name: Pearl.wtf Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Create as prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build Pearl.wtf.apk
        run: gradle :app:assembleDebug
      - name: Verify artifact
        run: |
          test -f app/build/outputs/apk/debug/Pearl.wtf.apk
          cp app/build/outputs/apk/debug/Pearl.wtf.apk Pearl.wtf.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            PRE="false"
          else
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.prerelease }}"
          fi
          args=("--title" "Pearl.wtf $TAG" "--generate-notes")
          if [[ "$PRE" == "true" ]]; then args+=("--prerelease"); fi
          gh release create "$TAG" "Pearl.wtf.apk#Pearl.wtf.apk" "${args[@]}"
